<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Detalle de producto de Industrial Import NYM para consulta y cotización." />
    <meta name="robots" content="noindex, follow" />
    <title>Detalle de producto | Industrial Import NYM</title>
    <link rel="icon" href="imagenes/optimized/banners/banner-1.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/product-detail.css" />
  </head>
  <body>
    <header class="header">
      <div class="container nav">
        <a href="index.html" class="logo">
          <div class="logo-mark">NYM</div>
          <div class="logo-text">
            <h1>Industrial Import NYM</h1>
            <p>Catálogo industrial</p>
          </div>
        </a>

        <nav class="nav-menu" id="nav-menu">
          <a href="index.html">Inicio</a>
          <a href="productos.html" class="active">Productos</a>
          <a href="marcas.html">Marcas</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
    </header>

    <main class="detail-section">
      <div class="container">
        <a href="productos.html" class="section-badge"

        >
        <div class="detail-shell" id="product-detail">
          <div class="detail-media">
            <img src="imagenes/optimized/productos/productos-1.webp" alt="Producto" />

            <span class="product-brand">Cargando...</span>

            <p>Estamos cargando la información del producto.</p>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/site-utils.js"></script>
    <script src="js/product-detail.js"></script>
