<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Pagina no encontrada | Industrial Import NYM</title>
    <link rel="icon" href="imagenes/optimized/banners/banner-1.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(47, 91, 255, 0.18), transparent 30%),
          linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
      }

      .error-page {
        width: min(100%, 680px);
        text-align: center;
      }

      .error-code {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
        margin-bottom: 22px;
        border-radius: 28px;
        background: linear-gradient(135deg, var(--primary), #7aa2ff);
        color: var(--white);
        font-size: 2rem;
        font-weight: 800;
        box-shadow: var(--shadow-md);
      }

      .error-page h1 {
        margin-bottom: 14px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.08;
      }

      .error-page p {
        margin: 0 auto 28px;
        max-width: 52ch;
        color: var(--muted);
      }

      .error-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <main class="error-page">
      <div class="error-code">404</div>
      <h1>Pagina no encontrada</h1>
      <p>
        La ruta que intentas abrir no existe o fue movida. Puedes volver al inicio o revisar el catalogo de productos.
      </p>
      <div class="error-actions">
        <a class="btn btn-primary" href="index.html">Volver al inicio</a>
        <a class="btn btn-secondary" href="productos.html">Ver productos</a>
      </div>
    </main>
  </body>
</html>
